# dsh-mobile-ui bundle patch: inserts its plugin row into the web plugin roster.
# The single row mounts BOTH halves: the host side (settings namespace) and the
# browser side (the modules node scans dsh.client packages into the web plugin
# roster, served from lib/client.js).
- insert:
    - id: mobile-ui
      name: '@dsh-external/dsh-mobile-ui'
